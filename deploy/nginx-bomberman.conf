# Nginx reverzní proxy pro Bomberman (Node běží na 127.0.0.1:3000).
# Ulož jako /etc/nginx/sites-available/bomberman a symlinkni do sites-enabled.
# Nejdřív stačí tento HTTP blok; certbot pak sám dopíše HTTPS (port 443).

server {
    listen 80;
    listen [::]:80;
    server_name bomberman.tvojedomena.cz;   # <-- uprav na svou doménu

    location / {
        proxy_pass http://127.0.0.1:3000;

        # tyhle 3 řádky jsou KLÍČOVÉ pro WebSocket (jinak se hra nepřipojí):
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ať dlouho otevřené WebSocket spojení nespadne:
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
